# graiphdeals catalogue: running and ultrarunning gear only (ADR 0012).
# Prices were read from each product page on the priceCheckedAt date and drift
# after it. originalPriceCents is set only where the page shows a struck-through
# price. URLs are plain product pages (merchant or authorised running retailer),
# with no affiliate or tracking parameters.
#
# Imagery is DELIBERATELY placeholder: every `images:` entry points at
# apps/web/public/deal-images/ph-*.svg (root-relative to the SPA origin).
# Product photos are the merchant's IP; do not hotlink them here.

