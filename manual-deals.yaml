# Seed catalog — real, currently-active promotions researched & page-verified
# 2026-07-18. Each deal's price was confirmed on the merchant's own product
# page at research time; prices drift, so re-verify on ingest refresh.
# URLs are plain merchant links (no affiliate params yet — see CONTENT-GO-LIVE
# Phase 4 for sub-ID wiring once network approvals land).
#
# Imagery is DELIBERATELY placeholder: every `images:` entry points at
# apps/web/public/deal-images/ph-*.svg and every card `artUrl:` at
# apps/web/public/card-art/ph-card-*.svg. Product photos are the merchant's IP
# and card art the issuer's, so real assets wait on network/issuer permission
# (same gate as the affiliate params above) — do not hotlink merchant or issuer
# images here. Paths are root-relative to the SPA origin; the SSR card
# templates absolutize them against APP_BASE_URL.

